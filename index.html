<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJAN SMM - ShinePage Style Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:90px}
.top{display:flex;justify-content:space-between;align-items:center;padding:15px}
.logo{font-size:22px;font-weight:bold;color:#f5c518}
.logo span{color:#fff}
.search{margin:0 15px;background:#1a1a1a;padding:14px;border-radius:30px;display:flex;gap:10px;color:#888}
.search input{background:none;border:none;outline:none;color:#fff;font-size:16px;width:100%}
.cat{display:flex;align-items:center;gap:15px;padding:18px 15px;border-bottom:1px solid #222;cursor:pointer}
.cat img{width:48px;height:48px;border-radius:12px}
.cat h2{font-size:20px;letter-spacing:1px;flex:1}
.cat span{color:#888;font-size:22px}
.service{display:flex;gap:15px;padding:16px 15px;border-bottom:1px solid #222;cursor:pointer}
.service img{width:48px;height:48px;border-radius:12px}
.service .info{flex:1}
.service h3{font-size:17px;line-height:1.4;font-weight:500}
.price-btn{display:inline-block;margin-top:10px;background:#1a1a1a;padding:8px 16px;border-radius:20px;color:#fff;font-weight:bold}
.hot{color:#ff9800;font-weight:bold}
.bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#1a1a1a;display:flex;gap:35px;padding:12px 30px;border-radius:30px;align-items:center;box-shadow:0 5px 20px #000}
.bottom div{text-align:center;font-size:13px;color:#aaa;cursor:pointer}
.bottom div.active{color:#29b6f6}
.hidden{display:none}
.back{padding:15px;font-size:20px;cursor:pointer}
.order-box{background:#1a1a1a;margin:15px;border-radius:20px;padding:20px}
.order-box input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff;font-size:16px}
.btn{display:block;text-align:center;padding:15px;border-radius:12px;font-weight:bold;text-decoration:none;margin-top:10px}
.wa{background:#25D366;color:#fff;font-size:18px}
.whatsapp-float{position:fixed;bottom:90px;left:15px;background:#25D366;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:99;text-decoration:none}
</style>
</head>
<body>

<div id="home">
<div class="top"><div class="logo">🔥 RAJAN<span> SMM</span></div></div>
<div class="search">🔍 <input placeholder="Search" oninput="searchCat(this.value)"></div>

<div onclick="openCat('INSTAGRAM')"><div class="cat"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"><h2>INSTAGRAM</h2><span>›</span></div></div>
<div onclick="openCat('YOUTUBE')"><div class="cat"><img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg"><h2>YOUTUBE</h2><span>›</span></div></div>
<div onclick="openCat('FACEBOOK')"><div class="cat"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg"><h2>FACEBOOK</h2><span>›</span></div></div>
<div onclick="openCat('TELEGRAM')"><div class="cat"><img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg"><h2>TELEGRAM</h2><span>›</span></div></div>
<div onclick="openCat('SNAPCHAT')"><div class="cat"><img src="https://upload.wikimedia.org/wikipedia/commons/a/ad/Snapchat_logo.svg"><h2>SNAPCHAT</h2><span>›</span></div></div>
<div onclick="openCat('TIKTOK')"><div class="cat"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Tiktok_icon.svg"><h2>TIKTOK</h2><span>›</span></div></div>
</div>

<div id="catPage" class="hidden">
<div class="back" onclick="goHome()">← Back</div>
<h2 id="catTitle" style="padding:0 15px 10px">INSTAGRAM</h2>
<div id="serviceList"></div>
</div>

<div id="orderPage" class="hidden">
<div class="back" onclick="goBackCat()">← Back</div>
<div class="order-box">
<h2 id="orderTitle">IG Views [ Superfast ]</h2>
<p id="orderPrice" style="color:#00e676;margin:8px 0">₹1 / 2000</p>
<label>Link / Username</label>
<input id="link" placeholder="Apna Instagram / YouTube Link Yaha Dale">
<label>Quantity</label>
<input type="number" id="qty" value="2000" oninput="calc()">
<h3 style="margin:12px 0">Total: <span id="total" style="color:#00e676">₹1</span></h3>
<a id="waBtn" class="btn wa" href="#">💬 WhatsApp Pe Order Karo</a>
<p style="color:#aaa;font-size:13px;margin-top:10px;text-align:center">Click karte hi WhatsApp khulega, seedha Rajan Bhai se baat hogi</p>
</div>
</div>

<a class="whatsapp-float" href="https://wa.me/919411035487?text=Hi%20Rajan%20Bhai%20Mujhe%20Order%20Karna%20Hai">💬</a>

<div class="bottom">
<div onclick="goHome()">🛒<br>Orders</div>
<div class="active">➕<br>Create</div>
<div onclick="window.open('https://wa.me/919411035487')">▦<br>Menu</div>
</div>

<script>
let services = {
"INSTAGRAM":[
{name:"IG Followers [ No Drop ]",price:10,unit:1000,tag:""},
{name:"IG Likes [ Instant ]",price:5,unit:1000,tag:""},
{name:"IG Views [ Superfast ]",price:1,unit:2000,tag:"🔥 Hot"},
{name:"IG Views [ Update in Professional Dashboard ]",price:0.94,unit:1000,tag:""},
{name:"IG Views [ One Click Done ] [ No Cancel Issue ] ⭐",price:1.1,unit:1000,tag:""},
{name:"IG Views [ On Photo or Carousel ]",price:1.7,unit:1000,tag:""},
{name:"IG Shares [ Cheapest ] [ NR ]",price:0.31,unit:1000,tag:""},
{name:"IG Post / Reel Saves [ Instant ]",price:2,unit:1000,tag:""},
],
"YOUTUBE":[
{name:"YouTube Short Views",price:5,unit:10000,tag:"🔥 Hot"},
{name:"YouTube Subscribe",price:10,unit:500,tag:""},
{name:"YouTube Views [ High Retention ]",price:5,unit:1000,tag:""},
{name:"YouTube Likes",price:8,unit:1000,tag:""},
],
"FACEBOOK":[
{name:"Facebook Followers",price:15,unit:1000,tag:""},
{name:"Facebook Likes",price:10,unit:1000,tag:""},
{name:"Facebook Views",price:2,unit:1000,tag:""},
],
"TELEGRAM":[
{name:"Telegram Members",price:20,unit:1000,tag:""},
{name:"Telegram Views",price:1,unit:1000,tag:""},
],
"SNAPCHAT":[
{name:"Snapchat Followers",price:20,unit:1000,tag:""},
],
"TIKTOK":[
{name:"TikTok Followers",price:15,unit:1000,tag:""},
{name:"TikTok Likes",price:8,unit:1000,tag:""},
{name:"TikTok Views",price:1,unit:1000,tag:""},
]
};
let currentCat="INSTAGRAM";
let currentService=null;

function openCat(cat){
currentCat=cat;
document.getElementById('home').classList.add('hidden');
document.getElementById('catPage').classList.remove('hidden');
document.getElementById('catTitle').innerText=cat;
renderServices();
}
function goHome(){
document.getElementById('home').classList.remove('hidden');
document.getElementById('catPage').classList.add('hidden');
document.getElementById('orderPage').classList.add('hidden');
}
function goBackCat(){
document.getElementById('orderPage').classList.add('hidden');
document.getElementById('catPage').classList.remove('hidden');
}
function renderServices(){
let html="";
services[currentCat].forEach((s,i)=>{
let icon = currentCat=="YOUTUBE" ? "https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" : currentCat=="INSTAGRAM" ? "https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" : "https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg";
html+=`<div class="service" onclick="openOrder(${i})"><img src="${icon}"><div class="info"><h3>${s.name}</h3><span class="price-btn">🛒 ₹${s.price} ›</span></div><div class="hot">${s.tag}</div></div>`;
});
document.getElementById('serviceList').innerHTML=html;
}
function openOrder(i){
currentService=services[currentCat][i];
document.getElementById('catPage').classList.add('hidden');
document.getElementById('orderPage').classList.remove('hidden');
document.getElementById('orderTitle').innerText=currentService.name;
document.getElementById('orderPrice').innerText="₹"+currentService.price+" / "+currentService.unit;
document.getElementById('qty').value=currentService.unit;
calc();
}
function calc(){
if(!currentService) return;
let qty=parseFloat(document.getElementById('qty').value)||0;
let link=document.getElementById('link').value||"";
let total=Math.ceil((currentService.price*qty)/currentService.unit);
if(total<1) total=1;
document.getElementById('total').innerText="₹"+total;
let msg="Hi Rajan Bhai! Mujhe Order Karna Hai\n\nService: "+currentService.name+"\nQuantity: "+qty+"\nTotal Price: ₹"+total+"\nLink / Username: "+link+"\n\nPlease Order Confirm Kar Do";
let waLink="https://wa.me/919411035487?text="+encodeURIComponent(msg);
document.getElementById('waBtn').href=waLink;
document.getElementById('waBtn').innerText="💬 WhatsApp Pe Order Karo - ₹"+total;
}
function searchCat(v){
if(v.toLowerCase().includes("insta")) openCat('INSTAGRAM');
if(v.toLowerCase().includes("you")) openCat('YOUTUBE');
}
document.getElementById('link').addEventListener('input',calc);
</script>
</body>
</html>
